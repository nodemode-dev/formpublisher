name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-fund
      - name: Audit
        working-directory: frontend
        run: npm audit --audit-level=low
      - name: Type check and build
        working-directory: frontend
        run: npm run build
      - name: Type check the shared dock module
        working-directory: frontend
        run: npm run typecheck:dock

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Requirement locks hold every pin
        run: python setup/lock_requirements.py --check
      - name: Install
        run: pip install --require-hashes -r backend/requirements.lock
      - name: Pinned Rust toolchain
        run: |
          source setup/lib.sh
          pin="$(fp_rust_pin)"
          rustup toolchain install "$pin" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$pin" >> "$GITHUB_ENV"
      - name: Languages complete
        run: python setup/i18n_check.py
      - name: Shared dock module matches its manifest
        run: python setup/dock_check.py
      - name: Self check
        run: python backend/formpublisher_engine.py --selfcheck
      - name: Compile
        run: python -m compileall -q backend/app setup
      - name: Agent skills, MCP tool list and stated counts in step
        run: ./formpublisher agents sync --check
      - name: Vendored crates in step
        run: ./formpublisher vendor --check
      - name: Build formweb-core
        working-directory: vendor/formweb-native
        run: cargo build --release --locked
      - name: Core self check
        run: vendor/formweb-native/target/release/formweb-core --selfcheck
      - name: Shell syntax
        run: bash -n formpublisher && bash -n formpublisher_oc_install && bash -n build_app && bash -n setup/lib.sh && bash -n setup/freeze_backend && bash -n setup/install_compiler

  windows-shell:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build script tool checks
        shell: cmd
        run: call build_app.bat --check-tools
      - name: Rust version is the pinned one
        working-directory: src-tauri
        shell: bash
        run: |
          rustc -V
          rustc -V | grep -q "$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
      - name: A window folder for the type check
        shell: bash
        run: mkdir -p frontend/dist && printf '<!doctype html><title>FormPublisher</title>' > frontend/dist/index.html
      - name: Shell type check
        working-directory: src-tauri
        run: cargo check --locked

  macos-shell:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: A window folder for the type check
        run: mkdir -p frontend/dist && printf '<!doctype html><title>FormPublisher</title>' > frontend/dist/index.html
      - name: Shell type check
        working-directory: src-tauri
        run: cargo check --locked
      - name: Shell syntax
        run: bash -n build_app && bash -n setup/freeze_backend

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.lock
      - name: Install
        run: pip install --require-hashes -r backend/requirements-test.lock
      - name: Pinned Rust toolchain
        run: |
          source setup/lib.sh
          pin="$(fp_rust_pin)"
          rustup toolchain install "$pin" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$pin" >> "$GITHUB_ENV"
      - name: Build formweb-core
        working-directory: vendor/formweb-native
        run: cargo build --release --locked -p formweb-core
      - name: Engine tests
        env:
          FORMPUBLISHER_REQUIRE_CORE: "1"
          FORMPUBLISHER_FORMWEB_CORE: ${{ github.workspace }}/vendor/formweb-native/target/release/formweb-core
        run: python -m pytest -q backend/tests
